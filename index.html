<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>
平野メディカルラリー QR受付
</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 15px;

  background: #f3f5f7;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

}

.container {

  max-width: 650px;

  margin: auto;

}

h1 {

  text-align: center;

  font-size: 25px;

}

.card {

  background: white;

  border-radius: 20px;

  padding: 18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.08);

}

#reader {

  width: 100%;

  margin-top: 15px;

}

button {

  width: 100%;

  padding: 18px;

  border: none;

  border-radius: 14px;

  background: #1976d2;

  color: white;

  font-size: 20px;

  font-weight: bold;

}

.success {

  margin-top: 20px;

  padding: 25px;

  border-radius: 15px;

  background: #d9f7df;

  color: #146c2e;

  text-align: center;

  font-size: 26px;

  font-weight: bold;

}

.error {

  margin-top: 20px;

  padding: 25px;

  border-radius: 15px;

  background: #ffe0e0;

  color: #a40000;

  text-align: center;

  font-size: 21px;

  font-weight: bold;

}

.info {

  margin-top: 20px;

  padding: 20px;

  border-radius: 15px;

  background: #eef5ff;

  text-align: center;

  font-size: 20px;

}

.status {

  text-align: center;

  margin-top: 10px;

  color: #555;

}

</style>

</head>


<body>

<div class="container">

<h1>
🚑 平野メディカルラリー<br>
QR受付
</h1>

<div class="card">

<button
  id="startButton"
  onclick="startScanner()">

📷 受付を開始する

</button>


<div
  id="reader">
</div>


<div
  id="status"
  class="status">

カメラを起動するには
「受付を開始する」を押してください

</div>


<div id="result"></div>

</div>

</div>


<script>


// ========================================
// Apps Script API
// ========================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbzQIBHKrFFkoKcyrEse7EgNJZtqw8z-4goIxX_Ruzy-5mrcwe948FumJP2Im0CH5cl4DQ/exec";


// ========================================
// Scanner
// ========================================

let scanner = null;

let running = false;

let processing = false;


// ========================================
// カメラ開始
// ========================================

async function startScanner() {

  if (running) {
    return;
  }


  document.getElementById(
    "status"
  ).textContent =
    "📷 カメラを起動しています...";


  document.getElementById(
    "startButton"
  ).disabled = true;


  try {

    // --------------------------------
    // まずブラウザにカメラ許可を要求
    // --------------------------------

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          }
        });


    // 許可確認だけ行う

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    // --------------------------------
    // QR scanner
    // --------------------------------

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.7;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      onScanSuccess,

      onScanFailure

    );


    running = true;


    document.getElementById(
      "status"
    ).textContent =
      "🟢 受付待機中 — QRコードをかざしてください";


  }

  catch(error) {

    console.error(error);


    document.getElementById(
      "startButton"
    ).disabled = false;


    document.getElementById(
      "status"
    ).textContent =
      "";


    showError(

      "📷 カメラを起動できませんでした<br><br>" +

      "iPhoneの場合はSafariのカメラ許可を確認してください。<br>" +

      "また、このページをSafari / Chromeで直接開いてください。<br><br>" +

      "<small>" +

      error.message +

      "</small>"

    );

  }

}


// ========================================
// QR成功
// ========================================

function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  processing = true;


  const ticketId =
    extractTicketId(
      decodedText
    );


  showInfo(
    "🔍 チケットを確認中..."
  );


  checkTicket(
    ticketId
  );

}


// ========================================
// QR読み取り失敗
// ========================================

function onScanFailure(
  error
) {

  // 読み取り途中のエラーなので
  // 何もしない

}


// ========================================
// チケットID抽出
// ========================================

function extractTicketId(
  value
) {

  value =
    String(value).trim();


  // HMR-0001

  if (
    value.startsWith("HMR-")
  ) {

    return value;

  }


  // URL

  try {

    const url =
      new URL(value);

    const id =
      url.searchParams.get(
        "id"
      );

    if (id) {
      return id;
    }

  }

  catch(error) {}


  return value;

}


// ========================================
// チケット確認
// ========================================

async function checkTicket(
  ticketId
) {

  try {

    const url =
      API_URL +
      "?action=info&id=" +
      encodeURIComponent(
        ticketId
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.found) {

      showError(
        "❌ 無効なチケットです<br><br>" +
        ticketId
      );

      resetScanner();

      return;

    }


    if (
      result.status ===
      "入場済み"
    ) {

      showError(

        "⚠️ すでに入場済みです<br><br>" +

        result.name +

        "<br><br>" +

        result.entryTime

      );


      resetScanner();

      return;

    }


    // --------------------------------
    // 入場確定
    // --------------------------------

    await checkIn(
      ticketId
    );

  }

  catch(error) {

    console.error(error);


    showError(

      "❌ 通信エラー<br><br>" +

      "インターネット接続を確認してください。"

    );


    resetScanner();

  }

}


// ========================================
// 入場確定
// ========================================

async function checkIn(
  ticketId
) {

  try {

    const url =
      API_URL +
      "?action=checkin&id=" +
      encodeURIComponent(
        ticketId
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (
      result.success
    ) {

      showSuccess(
        result.name,
        result.ticketId
      );


      // 振動

      if (
        navigator.vibrate
      ) {

        navigator.vibrate(
          [100, 50, 100]
        );

      }


    }

    else if (
      result.alreadyCheckedIn
    ) {

      showError(

        "⚠️ すでに入場済みです<br><br>" +

        result.name +

        "<br>" +

        result.entryTime

      );

    }

    else {

      showError(
        "❌ 入場処理に失敗しました"
      );

    }


    resetScanner();

  }

  catch(error) {

    console.error(error);


    showError(
      "❌ 入場処理中にエラーが発生しました"
    );


    resetScanner();

  }

}


// ========================================
// 自動リセット
// ========================================

function resetScanner() {

  setTimeout(

    function() {

      document.getElementById(
        "result"
      ).innerHTML = "";


      processing = false;


      document.getElementById(
        "status"
      ).textContent =
        "🟢 受付待機中 — 次のQRコードをどうぞ";

    },

    1800

  );

}


// ========================================
// 表示
// ========================================

function showSuccess(
  name,
  ticketId
) {

  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="success">' +

      '🟢 入場OK！<br><br>' +

      '<span style="font-size:20px">' +

      name +

      '</span><br>' +

      '<span style="font-size:16px">' +

      ticketId +

      '</span>' +

    '</div>';

}


function showError(
  message
) {

  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="error">' +

      message +

    '</div>';

}


function showInfo(
  message
) {

  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="info">' +

      message +

    '</div>';

}

</script>

</body>

</html>
