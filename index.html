<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>平野メディカルラリー QR受付</title>


  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #111;

      color: white;

      text-align: center;

    }


    .container {

      max-width: 600px;

      margin: auto;

      padding: 20px;

    }


    h1 {

      font-size: 24px;

    }


    #reader {

      width: 100%;

      max-width: 500px;

      margin: 20px auto;

      border-radius: 15px;

      overflow: hidden;

      background: #222;

    }


    button {

      width: 100%;

      padding: 18px;

      font-size: 18px;

      font-weight: bold;

      border: none;

      border-radius: 12px;

      background: #1976d2;

      color: white;

    }


    #status {

      margin-top: 20px;

      padding: 18px;

      border-radius: 12px;

      background: #222;

      line-height: 1.6;

    }


    .success {

      background: #1b5e20 !important;

    }


    .error {

      background: #b71c1c !important;

    }


    .warning {

      background: #e65100 !important;

    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    📷 平野メディカルラリー
  </h1>

  <p>
    QRコード受付
  </p>


  <button
    id="startButton"
    onclick="startScanner()">

    📷 カメラを起動

  </button>


  <div id="reader"></div>


  <div id="status">

    カメラを起動してください

  </div>

</div>


<script>


// ========================================
// 設定
// ========================================

let scanner = null;

let scanning = false;

let lastText = "";

let lastScanTime = 0;


// ========================================
// カメラ開始
// ========================================

async function startScanner() {

  const status =
    document.getElementById(
      "status"
    );


  status.className = "";

  status.innerHTML =
    "📷 カメラを準備しています…";


  try {

    // ==================================
    // カメラ権限を明示的に取得
    // ==================================

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    // 権限確認後、すぐ停止
    // 実際の映像はhtml5-qrcodeが使用

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


  } catch (error) {

    status.className =
      "error";


    status.innerHTML =
      "❌ カメラを使用できません<br><br>" +

      "ブラウザのカメラ許可を確認してください。";


    console.error(error);

    return;

  }


  // ==================================
  // QRスキャナー作成
  // ==================================

  scanner =
    new Html5Qrcode(
      "reader"
    );


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    );


    scanning = true;


    document
      .getElementById(
        "startButton"
      )
      .style.display =
      "none";


    status.className = "";


    status.innerHTML =
      "📷 QRコードをカメラに映してください<br>" +
      "<small>連続スキャンできます</small>";


  } catch (error) {

    status.className =
      "error";


    status.innerHTML =
      "❌ カメラの起動に失敗しました";


    console.error(error);

  }

}


// ========================================
// QR読み取り成功
// ========================================

function onScanSuccess(
  decodedText,
  decodedResult
) {

  const now =
    Date.now();


  // 同じQRの連続読み取り防止

  if (
    decodedText === lastText &&
    now - lastScanTime < 3000
  ) {

    return;

  }


  lastText =
    decodedText;

  lastScanTime =
    now;


  // ==================================
  // ID抽出
  // ==================================

  const ticketId =
    extractTicketId(
      decodedText
    );


  if (!ticketId) {

    showStatus(
      "error",
      "❌ このQRコードは<br>" +
      "平野メディカルラリーのチケットではありません"
    );

    return;

  }


  // ==================================
  // 親画面へ送信
  // ==================================

  showStatus(
    "",
    "🔍 チケットを確認しています…<br>" +
    ticketId
  );


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type: "qr",

        text: decodedText,

        ticketId: ticketId

      },

      "*"

    );

  } else {

    showStatus(
      "error",

      "❌ 受付画面との接続がありません<br><br>" +
      "受付画面からもう一度カメラを起動してください。"
    );

  }

}


// ========================================
// 読み取り失敗
// ========================================

function onScanFailure(
  errorMessage
) {

  // 読み取り失敗は正常
  // 毎フレーム発生するので表示しない

}


// ========================================
// チケットID抽出
// ========================================

function extractTicketId(
  text
) {

  text =
    String(
      text || ""
    ).trim();


  // HMR-0001

  const direct =
    text.match(
      /HMR-\d{4}/i
    );


  if (direct) {

    return direct[0]
      .toUpperCase();

  }


  // URL

  try {

    const url =
      new URL(text);


    const id =
      url.searchParams.get(
        "id"
      );


    if (id) {

      return id
        .trim()
        .toUpperCase();

    }

  } catch (error) {

    // URLではない

  }


  return "";

}


// ========================================
// 親画面から結果を受信
// ========================================

window.addEventListener(

  "message",

  function(event) {

    if (!event.data) {
      return;
    }


    if (
      event.data.type !==
      "checkinResult"
    ) {

      return;

    }


    const result =
      event.data.result;


    if (!result) {
      return;
    }


    // ==================================
    // 入場成功
    // ==================================

    if (
      result.success
    ) {

      showStatus(

        "success",

        "✅ 入場受付完了！<br><br>" +

        "<strong style='font-size:28px'>" +

        escapeHtml(
          result.name
        ) +

        "</strong><br><br>" +

        result.ticketId +

        "<br><br>" +

        result.entryTime

      );


      // バイブレーション

      if (
        navigator.vibrate
      ) {

        navigator.vibrate(
          [200, 100, 200]
        );

      }


      return;

    }


    // ==================================
    // 二重入場
    // ==================================

    if (
      result.alreadyCheckedIn
    ) {

      showStatus(

        "warning",

        "⚠️ すでに入場済みです<br><br>" +

        "<strong style='font-size:28px'>" +

        escapeHtml(
          result.name
        ) +

        "</strong><br><br>" +

        "入場日時：" +

        result.entryTime

      );


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(
          [500]
        );

      }


      return;

    }


    // ==================================
    // 未登録
    // ==================================

    if (
      result.notFound
    ) {

      showStatus(

        "error",

        "❌ このチケットは登録されていません"

      );


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(
          [500]
        );

      }


      return;

    }


    showStatus(

      "error",

      "❌ 入場処理に失敗しました"

    );

  }

);


// ========================================
// ステータス表示
// ========================================

function showStatus(
  className,
  html
) {

  const status =
    document.getElementById(
      "status"
    );


  status.className =
    className;


  status.innerHTML =
    html;

}


// ========================================
// HTMLエスケープ
// ========================================

function escapeHtml(
  text
) {

  return String(
    text || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
